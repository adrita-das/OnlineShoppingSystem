<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — Kartly</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>
<div class="split">

  <div class="form-panel">

    <div class="brand">Kartly</div>

    <p class="kicker">Account recovery</p>
    <h1>Forgot Password?</h1>

    <p class="hint" style="font-size: 13px; margin: 0 0 18px 0;">
      Enter your registered email address and we'll send you
      a link to reset your password.
    </p>

    <div class="banner error"
         th:if="${error}"
         th:text="${error}"
         id="errorMessage">
    </div>

    <div class="banner"
         th:if="${message}"
         th:text="${message}"
         style="background: #e0f6ef; color: #17876a;"
         id="successMessage">
    </div>

    <form method="post"
          th:action="@{/forgot-password}"
          id="forgotPasswordForm"
          novalidate>

      <label for="email">Email</label>

      <input type="email"
             id="email"
             name="email"
             th:value="${email}"
             autocomplete="email"
             placeholder="you@example.com">

      <button type="submit"
              id="sendResetBtn"
              class="btn-primary">
        Send Reset Link
      </button>

    </form>

    <p class="alt">
      Remember your password?
      <a th:href="@{/login}" id="signInLink">
        Sign in
      </a>
    </p>

  </div>

  <div class="art-panel">

    <div class="art-quote">
      <p>Don't worry,</p>
      <p>we'll help you get back in.</p>
    </div>

  </div>

</div>
</body>
</html>
