<!DOCTYPE html>
<html>

<head>

    <title>Online Shopping Products</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
            margin:0;
        }


        .header{

            background:#222;
            color:white;
            padding:20px;
            text-align:center;

        }


        .container{

            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:25px;
            padding:40px;

        }


        .card{

            background:white;
            width:250px;
            border-radius:12px;
            padding:20px;
            text-align:center;
            box-shadow:0px 5px 15px #bbb;

        }


        .card:hover{

            transform:scale(1.03);

        }


        .card img{

            width:200px;
            height:160px;
            object-fit:cover;
            border-radius:10px;

        }


        .card h3{

            color:#333;

        }


        .price{

            color:green;
            font-size:22px;
            font-weight:bold;

        }


        .buy-btn{

            background:#007bff;
            color:white;
            border:none;
            padding:12px 30px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;

        }


        .buy-btn:hover{

            background:#0056b3;

        }


    </style>


</head>


<body>


<div class="header">

    <h1 id="title">
        Available Products
    </h1>

    <p>Online Shopping Management System</p>

</div>



<div class="container">



    <div class="card">

        <img src="images/laptop.jpg">

        <h3>Laptop</h3>

        <p class="price">
            50000 BDT
        </p>

        <button class="buy-btn" id="laptopBtn" onclick="buyProduct('Laptop')">
            Buy Now
        </button>

    </div>




    <div class="card">

        <img src="images/mobile.jpg">

        <h3>Mobile Phone</h3>

        <p class="price">
            25000 BDT
        </p>

        <button class="buy-btn" id="mobileBtn" onclick="buyProduct('Mobile Phone')">
            Buy Now
        </button>

    </div>




    <div class="card">

        <img src="images/keyboard.jpg">

        <h3>Keyboard</h3>

        <p class="price">
            2000 BDT
        </p>

        <button class="buy-btn" id="keyboardBtn" onclick="buyProduct('Keyboard')">
            Buy Now
        </button>

    </div>




    <div class="card">

        <img src="images/watch.jpg">

        <h3>Smart Watch</h3>

        <p class="price">
            8000 BDT
        </p>

        <button class="buy-btn" id="watchBtn" onclick="buyProduct('Smart Watch')">
            Buy Now
        </button>

    </div>




    <div class="card">

        <img src="images/headphone.jpg">

        <h3>Headphone</h3>

        <p class="price">
            3000 BDT
        </p>

        <button class="buy-btn" id="headphoneBtn" onclick="buyProduct('Headphone')">
            Buy Now
        </button>

    </div>




    <div class="card">

        <img src="images/camera.jpg">

        <h3>Camera</h3>

        <p class="price">
            45000 BDT
        </p>

        <button class="buy-btn" id="cameraBtn" onclick="buyProduct('Camera')">
            Buy Now
        </button>

    </div>



</div>



<script>

    function buyProduct(product){

    alert(product + " selected for purchase");

    }

</script>


</body>

</html>
